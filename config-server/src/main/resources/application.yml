server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Đọc cấu hình từ thư mục local config-repo (native profile)
    active: native
  cloud:
    config:
      server:
        native:
          # Hỗ trợ cả khi chạy từ thư mục gốc project và từ trong module config-server
          search-locations: file:./config-repo,file:../config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
