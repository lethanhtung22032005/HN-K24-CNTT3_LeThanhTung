# ======================================================================
# CẤU HÌNH DÙNG CHUNG CHO TẤT CẢ SERVICE (được Config Server phân phát)
# ======================================================================
# - Đăng ký Eureka
# - Kafka (broker + JSON serializer/deserializer)
# - Actuator (health, circuitbreaker)
# - Resilience4j Circuit Breaker mặc định
# Cấu hình riêng từng service đặt trong file <spring.application.name>.yml
# ======================================================================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Không gửi kèm type header để có thể trao đổi giữa các package khác nhau
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.shopmart.*"
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Câu 2: cấu hình Circuit Breaker mặc định cho Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      inventory:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

logging:
  level:
    com.shopmart: INFO
    org.springframework.kafka: WARN
