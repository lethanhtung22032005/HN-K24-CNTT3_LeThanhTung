server:
  port: 8761

spring:
  application:
    name: eureka-server

# Câu 1: Eureka Server không tự đăng ký chính nó và không fetch registry
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
